<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Paneli — TOFAŞ · DİBA Denizli</title>
<meta name="theme-color" content="#0d1226">
<link rel="icon" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="panel.css">
</head>
<body class="pnl">

<!-- Giriş -->
<section class="login" id="login" hidden>
  <form class="login__card" id="loginForm" novalidate>
    <div class="login__logos"><img src="../assets/img/tofas-pill.png" alt="TOFAŞ" height="40"><img src="../assets/img/diba.png" alt="DİBA" height="54"></div>
    <h1>Yönetim Paneli</h1>
    <p>DİBA mobil uygulamasındaki <strong>yönetici</strong> hesabınızla girin.</p>
    <label class="fld"><span>Telefon</span><input class="input" name="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="05xx xxx xx xx" required></label>
    <label class="fld"><span>Şifre</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
    <p class="login__err" id="loginErr" role="alert"></p>
    <button class="btn btn--primary btn--lg" type="submit">Giriş yap</button>
    <a class="login__back" href="../index.html">← Siteye dön</a>
  </form>
</section>

<!-- Panel -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side__brand"><img src="../assets/img/tofas-pill.png" alt="" height="28"><img src="../assets/img/diba.png" alt="" height="36"><span>Yönetim</span></div>
    <nav class="side__nav" id="sideNav" aria-label="Panel menüsü"></nav>
    <div class="side__foot">
      <a class="btn btn--outline btn--sm" href="../index.html" target="_blank" rel="noopener">Siteyi aç ↗</a>
      <button class="btn btn--ghost btn--sm" type="button" id="logout">Çıkış</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="top__menu" type="button" id="menuBtn" aria-label="Menü">☰</button>
      <div><h1 id="viewTitle">Panel</h1><p id="viewSub"></p></div>
      <div class="top__user" id="who"></div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<!-- Düzenleme çekmecesi -->
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__bg" data-close></div>
  <form class="drawer__panel" id="editForm" novalidate role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header class="drawer__head"><h2 id="drawerTitle">Düzenle</h2><button type="button" class="drawer__x" data-close aria-label="Kapat">✕</button></header>
    <div class="drawer__body" id="drawerBody"></div>
    <footer class="drawer__foot">
      <button type="button" class="btn btn--ghost" data-close>Vazgeç</button>
      <button type="submit" class="btn btn--primary" id="saveBtn">Kaydet</button>
    </footer>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../data/config.js"></script>
<script src="panel.js"></script>
</body>
</html>
