# Render static site (demo) — build adımı yok, kök dizin olduğu gibi yayınlanır.
services:
  - type: web
    name: denizli-tofas-basketbol
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
